name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 2.0.0-preview.1). Must equal Constants.Version on the branch you run this from."
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # Lets the job request the identity token that nuget.org exchanges for a short-lived key.
      id-token: write
    env:
      AUTOBLOG_FIXTURE_STARTUP_MINUTES: 15
      # Read through the environment, never pasted into a script, so the input cannot be run as shell.
      VERSION: ${{ inputs.version }}
    steps:
      # Each Orchard Core line releases from its own branch: main, or release/* for an older line.
      - name: Only release from main or a release branch
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/')
        run: |
          echo "::error::Releases run from main or a release/* branch, not $GITHUB_REF."
          exit 1

      - uses: actions/checkout@v7

      - name: Read version from Constants.cs
        id: constants
        run: |
          CONST_VERSION=$(grep -oP 'Version\s*=\s*"\K[^"]+' src/IgniteSG.OrchardCore.MspMarketingEdge/Constants.cs)
          echo "VERSION=$CONST_VERSION" >> $GITHUB_OUTPUT

      - name: Validate input matches Constants.Version
        run: |
          if [ "$VERSION" != "${{ steps.constants.outputs.VERSION }}" ]; then
            echo "::error::Input version ($VERSION) does not match Constants.Version (${{ steps.constants.outputs.VERSION }}). Update Constants.Version before releasing."
            exit 1
          fi

      # A release is validated by running the module, not only by compiling it.
      - name: Build and verify
        uses: ./.github/actions/verify

      - name: Pack NuGet
        run: >
          dotnet pack src/IgniteSG.OrchardCore.MspMarketingEdge/IgniteSG.OrchardCore.MspMarketingEdge.csproj
          --configuration Release
          --no-build
          --output ./artifacts
          /p:PackageVersion=${{ steps.constants.outputs.VERSION }}

      # Publish first: if nuget.org refuses, nothing has been tagged or released and the run can simply be
      # started again.
      # Trusted Publishing: nuget.org checks this workflow's identity against the policy registered for the
      # IgniteSolutionsGroup owner and returns a key that lasts one hour, so no API key is stored anywhere.
      # "user" is the nuget.org profile name of the policy's creator, not an email address.
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: dsghi

      # --skip-duplicate makes a re-run safe when an earlier attempt already published the package.
      - name: Push to NuGet
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Tag release
        run: |
          git tag "v${{ steps.constants.outputs.VERSION }}"
          git push origin "v${{ steps.constants.outputs.VERSION }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.constants.outputs.VERSION }}
          files: ./artifacts/*.nupkg
          generate_release_notes: true
          # A version with a suffix (2.0.0-preview.1) is a prerelease and must not become "Latest".
          prerelease: ${{ contains(inputs.version, '-') }}
