name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.6.1)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Read version from Constants.cs
        id: constants
        run: |
          CONST_VERSION=$(grep -oP 'Version\s*=\s*"\K[^"]+' src/IgniteSG.OrchardCore.MspMarketingEdge/Constants.cs)
          echo "VERSION=$CONST_VERSION" >> $GITHUB_OUTPUT

      - name: Validate tag matches Constants.Version
        run: |
          if [ "${{ steps.version.outputs.VERSION }}" != "${{ steps.constants.outputs.VERSION }}" ]; then
            echo "::error::Tag version (${{ steps.version.outputs.VERSION }}) does not match Constants.Version (${{ steps.constants.outputs.VERSION }}). Update Constants.Version before tagging."
            exit 1
          fi

      - name: Stamp Manifest.cs with version from Constants
        run: |
          sed -i "s/Version = \"[^\"]*\"/Version = \"${{ steps.constants.outputs.VERSION }}\"/" \
            src/IgniteSG.OrchardCore.MspMarketingEdge/Manifest.cs

      - name: Restore dependencies
        run: dotnet restore src/IgniteSG.OrchardCore.sln

      - name: Build
        run: dotnet build src/IgniteSG.OrchardCore.sln --configuration Release --no-restore

      - name: Pack NuGet
        run: >
          dotnet pack src/IgniteSG.OrchardCore.MspMarketingEdge/IgniteSG.OrchardCore.MspMarketingEdge.csproj
          --configuration Release
          --no-build
          --output ./artifacts
          /p:PackageVersion=${{ steps.version.outputs.VERSION }}

      - name: Push to NuGet
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.nupkg
          generate_release_notes: true
