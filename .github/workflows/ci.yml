name: Build

on:
  pull_request:
    branches: [main, 'release/**', 'codex/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # A build agent starts the fixture site in seconds; this only bounds a hung start.
      AUTOBLOG_FIXTURE_STARTUP_MINUTES: 15

    steps:
      - uses: actions/checkout@v7

      - name: Build and verify
        uses: ./.github/actions/verify

      - name: Read version from Constants.cs
        id: constants
        run: |
          CONST_VERSION=$(grep -oP 'Version\s*=\s*"\K[^"]+' src/IgniteSG.OrchardCore.MspMarketingEdge/Constants.cs)
          echo "VERSION=$CONST_VERSION" >> $GITHUB_OUTPUT

      - name: Pack
        run: >
          dotnet pack
          src/IgniteSG.OrchardCore.MspMarketingEdge/IgniteSG.OrchardCore.MspMarketingEdge.csproj
          --configuration Release
          --no-build
          --output ./artifacts
          /p:PackageVersion=${{ steps.constants.outputs.VERSION }}-ci.${{ github.run_number }}

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: IgniteSG.OrchardCore.MspMarketingEdge
          path: ./artifacts/
          retention-days: 90
