name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/Ignite.OrchardCore.sln

      - name: Build
        run: dotnet build src/Ignite.OrchardCore.sln --configuration Release --no-restore

      - name: Publish
        run: >
          dotnet publish
          src/Ignite.OrchardCore.MspMarketingEdge/Ignite.OrchardCore.MspMarketingEdge.csproj
          --configuration Release
          --no-build
          --output ./artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ignite.OrchardCore.MspMarketingEdge
          path: ./artifacts/
          retention-days: 90
