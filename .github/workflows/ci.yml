name: Build

on:
  pull_request:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/IgniteSG.OrchardCore.sln

      - name: Build
        run: dotnet build src/IgniteSG.OrchardCore.sln --configuration Release --no-restore

      - name: Publish
        run: >
          dotnet publish
          src/IgniteSG.OrchardCore.MspMarketingEdge/IgniteSG.OrchardCore.MspMarketingEdge.csproj
          --configuration Release
          --no-build
          --output ./artifacts

      - name: Verify preserved editorial content
        run: dotnet run --project tests/VerifyEditorial -c Release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: IgniteSG.OrchardCore.MspMarketingEdge
          path: ./artifacts/
          retention-days: 90
