name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/Ignite.OrchardCore.sln

      - name: Build
        run: dotnet build src/Ignite.OrchardCore.sln --configuration Release --no-restore

      # Uncomment when you add tests
      # - name: Test
      #   run: dotnet test src/Ignite.OrchardCore.sln --configuration Release --no-restore --no-build
