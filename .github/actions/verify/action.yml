name: Build and verify
description: >
  Restores from the committed lock files, builds the module and its test hosts, and runs every fixture mode:
  a new site, a new site on Azure Blob media, and an upgrade from the released module on Orchard Core 3.

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        # The Orchard Core 3 seed site for the upgrade check runs on .NET 10.
        dotnet-version: 10.0.x

    - name: Restore from lock files
      shell: bash
      run: |
        dotnet restore src/IgniteSG.OrchardCore.sln --locked-mode
        dotnet restore tests/VerifyEditorial --locked-mode
        dotnet restore tests/SeedOrchard3 --locked-mode

    - name: Build
      shell: bash
      run: |
        dotnet build src/IgniteSG.OrchardCore.sln --configuration Release --no-restore
        dotnet build tests/VerifyEditorial --configuration Release --no-restore
        dotnet build tests/SeedOrchard3 --configuration Release --no-restore

    - name: Verify on a new site
      shell: bash
      run: dotnet run --project tests/VerifyEditorial -c Release --no-build

    - name: Start the Azure Storage emulator
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/azurite"
        npx --yes azurite@3.37.0 --silent --skipApiVersionCheck --location "$RUNNER_TEMP/azurite" > "$RUNNER_TEMP/azurite.log" 2>&1 &
        for attempt in $(seq 1 60); do
          if (echo > /dev/tcp/127.0.0.1/10000) 2>/dev/null; then exit 0; fi
          sleep 2
        done
        echo "::error::The Azure Storage emulator did not start."
        cat "$RUNNER_TEMP/azurite.log"
        exit 1

    - name: Verify on a new site with Azure Blob media
      shell: bash
      run: dotnet run --project tests/VerifyEditorial -c Release --no-build -- --azure-media

    - name: Seed an Orchard Core 3 site with the released module
      shell: bash
      run: dotnet run --project tests/SeedOrchard3 -c Release --no-build -- "$RUNNER_TEMP/seed-orchard3"

    - name: Verify the upgrade from Orchard Core 3
      shell: bash
      run: dotnet run --project tests/VerifyEditorial -c Release --no-build -- --upgrade-from "$RUNNER_TEMP/seed-orchard3"
